# The dsh-mux plugin's patch layer (feature-loop/fixture row format).
#
# Row 1: the host plugin — tool `mux`, commands `/mux` + `/ask`, thread store.
# Row 2: the host remote service — `ctx.remote.mux.*` for the browser page.
#
# With no `config:` the rows load with defaults (10 min turn timeout,
# 1 MiB output cap, workspace = host cwd). Override per field, e.g.
#     config:
#       timeoutMs: 300000
#       workspace: /work

- insert:
    - id: dsh-mux
      name: '@freepeak/dsh-mux'
    - id: dsh-mux-remote
      name: '@freepeak/dsh-mux/remote'
