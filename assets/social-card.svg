<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="dsh-mux">
  <title>dsh-mux — coding CLIs inside DeepSeek Harness</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#070D18"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152341"/>
      <stop offset="1" stop-color="#0A1324"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <circle cx="1100" cy="80" r="220" fill="#22D3EE" opacity="0.06"/>
  <circle cx="160" cy="560" r="260" fill="#A78BFA" opacity="0.07"/>
  <g transform="translate(120,200)">
    <rect width="200" height="200" rx="44" fill="url(#tile)"/>
    <g transform="translate(20,20) scale(2.5)">
      <path d="M12 20 C28 20, 28 32, 36 32" fill="none" stroke="#22D3EE" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M12 44 C28 44, 28 32, 36 32" fill="none" stroke="#A78BFA" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="36" cy="32" r="5" fill="#F8FAFC"/>
      <path d="M41 32 H52" fill="none" stroke="url(#out)" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="52" cy="32" r="3.2" fill="#34D399"/>
    </g>
  </g>
  <text x="380" y="290" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#F8FAFC">dsh-mux</text>
  <text x="380" y="360" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" fill="#94A3B8">Talk to coding CLIs from the DeepSeek Harness GUI — and keep the thread.</text>
  <text x="380" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#64748B">/mux · /ask · resume by session id · seven adapters</text>
  <text x="120" y="580" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#475569">FreePeak · MIT</text>
</svg>
