# Dependabot for @freepeak/dsh-mux.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
    ignore:
      # Harness peers are optional and versioned against private lines.
      - dependency-name: "@deepseek-ai/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
