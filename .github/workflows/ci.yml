# CI for @freepeak/dsh-mux.
#
# Node 22 is required (`node --experimental-strip-types`). The suite is offline
# and does not need real CLI binaries or a harness profile.
#
# ---------------------------------------------------------------------------
# RUNNER: these jobs target GitHub-hosted `ubuntu-latest`.
#
# This repository is PUBLIC. A pull-request job on a self-hosted runner
# executes the PR author's code on a maintainer's machine, with that machine's
# files and credentials in reach — so fork PRs must never run there. The old
# self-hosted setup existed only because private repos have a small monthly
# Actions allowance; public repositories get unlimited free hosted minutes, so
# the constraint no longer applies.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # .npmrc sets auto-install-peers=false so unpublished harness peers do not
      # abort the install. Only schemastery + tsdown/typescript/@types/node land.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build host bundle
        run: npm run build

      - name: Re-run artifact gates after build
        run: node --experimental-strip-types --test test/artifacts.test.ts
