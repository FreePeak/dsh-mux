# CI for @freepeak/dsh-mux.
#
# Node 22 is required (`node --experimental-strip-types`). The suite is offline
# and does not need real CLI binaries or a harness profile.
#
# Repository is currently private — hosted Actions minutes are limited. Prefer
# small jobs. If this repo is made public, keep runs-on as a GitHub-hosted label
# (never self-hosted) so fork PRs cannot execute on a maintainer machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build host bundle
        run: npm run build
      - name: Re-run artifact gates after build
        run: node --experimental-strip-types --test test/artifacts.test.ts
